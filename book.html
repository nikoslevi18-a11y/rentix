 if(e.fields){setErr(N.nm,N.nmE,T.invalid);setErr(N.ph,N.phE,T.phoneReq);N.nm.focus()}
 if(e.reload)refreshInfo(e.dates);
 if(e.dates){a=b=null;renderCal();renderForm();N.dates.scrollIntoView({behavior:'smooth',block:'start'});N.dates.prepend(h('div',{cls:'msg',role:'alert'},e.t));N.msg.textContent=''}}
// Re-fetch busy days quietly after 'unavailable'/'not_found' without losing what the customer typed.
async function refreshInfo(keepMsg){const r=await rpc('public_page_info',{p_slug:slug});if(!r.ok||!r.j||!Array.isArray(r.j.items))return;
 applyInfo(r.j);renderHead();const it=item&&info.items.find(x=>x.id===item.id);
 if(it){item=it;busy=new Set(Array.isArray(it.busy)?it.busy:[])}else{item=null;a=b=null}
 const m=keepMsg&&N.dates.querySelector(':scope>.msg');renderList();renderCal();if(m&&item)N.dates.prepend(m);renderForm()}
function done(){const wa=info.whatsapp&&/^\d{6,15}$/.test(String(info.whatsapp))?String(info.whatsapp):'';
 const again=h('button',{type:'button',cls:'btn'+(wa?' sec':''),on:{click:anotherRequest}},T.again);
 app.replaceChildren(h('div',{cls:'done'},h('div',{cls:'ring','aria-hidden':'true'},'✓'),h('h1',{tabindex:'-1',id:'okT'},T.okT),h('div',{cls:'sub',style:'margin:8px 0 22px'},T.okS),
  wa?h('a',{cls:'btn',href:'https://wa.me/'+wa,rel:'noopener',target:'_blank'},T.wa):null,again));
 const t=document.getElementById('okT');if(t)t.focus();window.scrollTo(0,0)}
// Keeps name and phone (same customer), clears the rest so they can ask for another item.
function anotherRequest(){item=null;a=b=null;qty=1;N.nt.value='';N.msg.textContent='';query='';if(N.search)N.search.value='';
 const cur=monthIdx(today);vy=Math.floor(cur/12);vm=cur%12;show();renderList();renderCal();renderForm();window.scrollTo(0,0);
 const f=N.list.querySelector('.item');if(f)f.focus();refreshInfo(false)}
function applyInfo(j){info=j;info.items=Array.isArray(j.items)?j.items:[];today=bizToday(j);maxDay=addDays(today,MAX_AHEAD)}
function stateView(text,retry){const box=h('div',{cls:'state'},h('div',{cls:'sub',role:retry?'alert':'status'},text));
 if(retry)box.append(h('button',{type:'button',cls:'btn',on:{click:load}},T.retry));app.replaceChildren(box);const bt=box.querySelector('button');if(bt)bt.focus()}
async function load(){if(!/^[a-z0-9-]{3,40}$/i.test(slug)){stateView(T.nf);return}
 stateView(T.loading);const r=await rpc('public_page_info',{p_slug:slug});
 if(r.net||(!r.ok&&r.status>=500)||r.status===408||r.status===429){stateView(T.loadErr+' '+(r.net?T.net:''),true);return}
 if(!r.ok||!r.j||typeof r.j!=='object'){stateView(T.nf);return}
 applyInfo(r.j);document.title=String(info.name||'Book');const cur=monthIdx(today);vy=Math.floor(cur/12);vm=cur%12;
 build();renderHead();renderList();show()}
load();
